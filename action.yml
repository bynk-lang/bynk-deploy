name: Bynk Deploy
description: >-
  Deploy a Bynk project to Cloudflare Workers with the `bynk deploy` driver.
author: bynk-lang

branding:
  icon: upload-cloud
  color: purple

inputs:
  version:
    description: Bynk version to install (passed to setup-bynk).
    required: false
    default: latest
  repository:
    description: The owner/name repo that publishes Bynk releases.
    required: false
    default: accuser/bynk
  working-directory:
    description: Project root, the directory that holds `bynk.toml`.
    required: false
    default: "."
  context:
    description: >-
      Deploy this one context alone (`--context`), by dotted name or worker
      name. Its dependencies are not deployed, and the deploy is refused if a
      context it binds to has never been deployed. Empty deploys every context
      in Service Binding order.
    required: false
    default: ""
  environment:
    description: Target environment (`--env`). Empty is the driver's `default`.
    required: false
    default: ""
  dry-run:
    description: Print the plan (`--dry-run`) without touching Cloudflare.
    required: false
    default: "false"
  plan-format:
    description: >-
      How a dry run prints the plan in the log: `text` (the driver's `short`
      format) or `json`. The `plan` output is always JSON.
    required: false
    default: json
  secrets:
    description: >-
      Multiline dotenv content (`NAME=value` per line), passed to the driver as
      `--secrets-file`. Every name supplied here is set on every deployed
      context. Values are masked and the file is deleted after the run.
    required: false
    default: ""
  force-secrets:
    description: >-
      Overwrite secrets that are already set (`--force`). Use after rotating a
      value; by default only missing secrets are set.
    required: false
    default: "false"
  extra-args:
    description: >-
      Arguments forwarded to `wrangler deploy` after `--`, split on whitespace
      (newlines count as whitespace; no shell quoting). `--env`/`--environment`
      here is rejected by the
      driver; use the `environment` input.
    required: false
    default: ""
  node-version:
    description: Node.js version to set up for Wrangler. The driver needs 22 or later.
    required: false
    default: "22"
  cloudflare-api-token:
    description: >-
      Cloudflare API token (set as CLOUDFLARE_API_TOKEN). A real deploy needs
      this or CLOUDFLARE_API_TOKEN in the step's env; a dry run never
      authenticates.
    required: false
    default: ""
  cloudflare-account-id:
    description: Cloudflare account ID (set as CLOUDFLARE_ACCOUNT_ID).
    required: false
    default: ""
  github-token:
    description: Token for setup-bynk's API calls.
    required: false
    default: ${{ github.token }}

outputs:
  plan:
    description: The deploy plan as JSON (`bynk deploy --dry-run --format json`).
    value: ${{ steps.plan.outputs.plan }}
  contexts:
    description: >-
      Space-separated worker names in deploy order. The driver pushes every
      one (each plan action is `deploy` or `redeploy`), so after a successful
      real deploy these are the contexts that were deployed.
    value: ${{ steps.plan.outputs.contexts }}
  lock-changed:
    description: >-
      "true" if a real deploy changed `bynk.deploy.lock`, which must then be
      committed. Always "false" for a dry run.
    value: ${{ steps.lock.outputs.changed || 'false' }}

runs:
  using: composite
  steps:
    - name: Check project
      shell: bash
      env:
        INPUT_WORKING_DIRECTORY: ${{ inputs.working-directory }}
        INPUT_PLAN_FORMAT: ${{ inputs.plan-format }}
        INPUT_DRY_RUN: ${{ inputs.dry-run }}
        INPUT_FORCE_SECRETS: ${{ inputs.force-secrets }}
      run: ${{ github.action_path }}/scripts/deploy.sh check

    - name: Install Bynk
      uses: bynk-lang/setup-bynk@v1
      with:
        version: ${{ inputs.version }}
        repository: ${{ inputs.repository }}
        github-token: ${{ inputs.github-token }}

    - name: Set up Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ inputs.node-version }}

    - name: Write secrets file
      id: secrets
      if: inputs.secrets != ''
      shell: bash
      env:
        INPUT_SECRETS: ${{ inputs.secrets }}
      run: ${{ github.action_path }}/scripts/deploy.sh secrets

    - name: Plan
      id: plan
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        INPUT_CONTEXT: ${{ inputs.context }}
        INPUT_ENVIRONMENT: ${{ inputs.environment }}
        INPUT_DRY_RUN: ${{ inputs.dry-run }}
        INPUT_PLAN_FORMAT: ${{ inputs.plan-format }}
        INPUT_FORCE_SECRETS: ${{ inputs.force-secrets }}
        INPUT_EXTRA_ARGS: ${{ inputs.extra-args }}
        SECRETS_FILE: ${{ steps.secrets.outputs.path }}
      run: ${{ github.action_path }}/scripts/deploy.sh plan

    - name: Deploy
      if: inputs.dry-run != 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        INPUT_CONTEXT: ${{ inputs.context }}
        INPUT_ENVIRONMENT: ${{ inputs.environment }}
        INPUT_FORCE_SECRETS: ${{ inputs.force-secrets }}
        INPUT_EXTRA_ARGS: ${{ inputs.extra-args }}
        INPUT_CLOUDFLARE_API_TOKEN: ${{ inputs.cloudflare-api-token }}
        INPUT_CLOUDFLARE_ACCOUNT_ID: ${{ inputs.cloudflare-account-id }}
        SECRETS_FILE: ${{ steps.secrets.outputs.path }}
      run: ${{ github.action_path }}/scripts/deploy.sh deploy

    - name: Check bynk.deploy.lock
      id: lock
      if: always() && inputs.dry-run != 'true' && steps.plan.outcome == 'success'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        INPUT_WORKING_DIRECTORY: ${{ inputs.working-directory }}
      run: ${{ github.action_path }}/scripts/deploy.sh lock

    - name: Remove secrets file
      if: always() && steps.secrets.outputs.path != ''
      shell: bash
      env:
        SECRETS_FILE: ${{ steps.secrets.outputs.path }}
      run: ${{ github.action_path }}/scripts/deploy.sh cleanup
