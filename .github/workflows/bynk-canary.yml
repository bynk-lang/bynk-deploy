# Bynk canary: re-run this action against a new Bynk release, and keep a
# `canary` issue open while it fails.
#
# Triggered by the org dispatcher in bynk-lang/.github (on each Bynk release,
# and weekly), which is why there is no `schedule` here. This repository is
# listed in bynk-lang/.github's canary/repos.json, and the canary GitHub App is
# installed on it. See https://github.com/bynk-lang/.github/blob/main/canary/README.md
#
# The canary runs the released bynk-deploy@v2 as a dry run of the `single`
# fixture, which compiles the project and plans the deploy without touching
# Cloudflare. test.yml's assertions on the JSON plan stay pinned to
# BYNK_VERSION; this only proves the action still works end to end.
name: Bynk canary

on:
  repository_dispatch:
    types: [bynk-canary]
  workflow_dispatch:
    inputs:
      version:
        description: Bynk version, exact ("0.303.4") or "latest"
        type: string
        default: latest

permissions:
  contents: read
  issues: write

jobs:
  canary:
    name: Canary
    uses: bynk-lang/.github/.github/workflows/canary.yml@v1
    with:
      version: ${{ github.event.client_payload.version || inputs.version || 'latest' }}
      kind: action
      working-directory: test/fixtures/single
      ci: false                # the dry run compiles the project
      deploy-dry-run: true
    secrets:
      # Optional: report results to the compat board. Skipped unless both are set.
      report-url: ${{ secrets.BYNK_CANARY_REPORT_URL }}
      report-key: ${{ secrets.BYNK_CANARY_REPORT_KEY }}
