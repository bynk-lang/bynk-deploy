name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: Bynk version to test, exact or "latest" (empty for the pinned baseline)
        type: string
        default: ""
  # bynk-canary.yml calls this at each new Bynk release, so the plan
  # assertions below also run against releases newer than the baseline.
  workflow_call:
    inputs:
      version:
        description: Bynk version to test, exact or "latest" (empty for the pinned baseline)
        type: string
        default: ""

permissions:
  contents: read

# Every run is a dry run: `bynk deploy --dry-run` never authenticates, so no
# Cloudflare credentials are needed. The assertions read the JSON plan.
#
# Push and pull_request runs use the pinned baseline, so a red build means the
# change broke something, not that a new compiler came out. Bump the baseline
# deliberately, ideally in the same PR as any deploy.sh change the new release
# needs.
env:
  BYNK_VERSION: ${{ inputs.version || '0.313.0' }}

jobs:
  single:
    name: One context (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Dry run
        id: deploy
        uses: ./
        with:
          version: ${{ env.BYNK_VERSION }}
          working-directory: test/fixtures/single
          dry-run: "true"
          secrets: |
            # A supplied name, on top of the declared and read ones.
            STRIPE_KEY="sk_test_fixture"

      - name: Assert on the plan
        shell: bash
        env:
          PLAN: ${{ steps.deploy.outputs.plan }}
          CONTEXTS: ${{ steps.deploy.outputs.contexts }}
          LOCK_CHANGED: ${{ steps.deploy.outputs.lock-changed }}
        run: |
          set -euo pipefail
          check() { echo "$PLAN" | jq -e "$1" >/dev/null || { echo "::error::plan check failed: $1"; echo "$PLAN"; exit 1; }; }
          check '.order == ["notes"]'
          # From Bynk 0.313.0 agents are declared in Wrangler's `exports`, as
          # SQLite-backed Durable Objects, not by a `v1` migration.
          check '.contexts[0].durable_objects == [{"class": "Note", "storage": "sqlite", "reconciled_by": "Cloudflare"}]'
          check '.contexts[0].secrets | map(select(.name == "AUTH_JWT_SECRET"))[0].origin == "declared"'
          check '.contexts[0].secrets | map(select(.name == "GREETING"))[0].origin == "read"'
          check '.contexts[0].secrets | map(select(.name == "STRIPE_KEY"))[0].origin == "supplied"'
          check '.contexts[0].secrets_complete == true'
          check '.contexts[0].action == "deploy"'
          [ "$CONTEXTS" = "notes" ] || { echo "::error::contexts output was '$CONTEXTS'"; exit 1; }
          [ "$LOCK_CHANGED" = "false" ] || { echo "::error::lock-changed was '$LOCK_CHANGED'"; exit 1; }

      - name: Assert the dry run left nothing behind
        shell: bash
        run: |
          set -euo pipefail
          if [ -e test/fixtures/single/bynk.deploy.lock ]; then
            echo "::error::a dry run wrote bynk.deploy.lock"; exit 1
          fi
          if ls "$RUNNER_TEMP"/bynk-secrets.* >/dev/null 2>&1; then
            echo "::error::the secrets file was not removed"; exit 1
          fi
          git diff --exit-code -- test/fixtures

      - name: Dry run, text plan
        uses: ./
        with:
          version: ${{ env.BYNK_VERSION }}
          working-directory: test/fixtures/single
          dry-run: "true"
          plan-format: text

  pair:
    name: Two contexts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Dry run
        id: deploy
        uses: ./
        with:
          version: ${{ env.BYNK_VERSION }}
          working-directory: test/fixtures/pair
          dry-run: "true"

      - name: Assert on the plan
        shell: bash
        env:
          PLAN: ${{ steps.deploy.outputs.plan }}
          CONTEXTS: ${{ steps.deploy.outputs.contexts }}
        run: |
          set -euo pipefail
          check() { echo "$PLAN" | jq -e "$1" >/dev/null || { echo "::error::plan check failed: $1"; echo "$PLAN"; exit 1; }; }
          # Payment first: orders binds to it. (Alphabetical order would be the reverse.)
          check '.order == ["shop-payment", "shop-orders"]'
          check '.contexts | map(.worker) == ["shop-payment", "shop-orders"]'
          check '.contexts[1].binds_to == ["shop-payment"]'
          check '.contexts[0].binds_to == []'
          check '[.contexts[].durable_objects] == [[], []]'
          [ "$CONTEXTS" = "shop-payment shop-orders" ] || { echo "::error::contexts output was '$CONTEXTS'"; exit 1; }

      - name: Dry run of one context whose dependency was never deployed
        id: context
        continue-on-error: true
        uses: ./
        with:
          version: ${{ env.BYNK_VERSION }}
          working-directory: test/fixtures/pair
          context: shop.orders
          dry-run: "true"

      - name: Dry run with --env after --
        id: env-conflict
        continue-on-error: true
        uses: ./
        with:
          version: ${{ env.BYNK_VERSION }}
          working-directory: test/fixtures/pair
          environment: staging
          extra-args: --env production
          dry-run: "true"

      - name: Dry run with --env on the second line of extra-args
        id: env-conflict-multiline
        continue-on-error: true
        uses: ./
        with:
          version: ${{ env.BYNK_VERSION }}
          working-directory: test/fixtures/pair
          environment: staging
          extra-args: |
            --keep-vars
            --env production
          dry-run: "true"

      - name: A dry-run value other than true/false
        id: bad-bool
        continue-on-error: true
        uses: ./
        with:
          version: ${{ env.BYNK_VERSION }}
          working-directory: test/fixtures/pair
          dry-run: "True"

      - name: Dry run outside a Bynk project
        id: no-project
        continue-on-error: true
        uses: ./
        with:
          version: ${{ env.BYNK_VERSION }}
          working-directory: test/fixtures
          dry-run: "true"

      - name: Assert the refusals
        shell: bash
        env:
          CONTEXT: ${{ steps.context.outcome }}
          ENV_CONFLICT: ${{ steps.env-conflict.outcome }}
          ENV_CONFLICT_MULTILINE: ${{ steps.env-conflict-multiline.outcome }}
          BAD_BOOL: ${{ steps.bad-bool.outcome }}
          NO_PROJECT: ${{ steps.no-project.outcome }}
        run: |
          set -euo pipefail
          [ "$CONTEXT" = "failure" ] || { echo "::error::--context with an undeployed dependency was not refused"; exit 1; }
          [ "$ENV_CONFLICT" = "failure" ] || { echo "::error::--env after -- was not refused"; exit 1; }
          # Refused only if the second line of the block reaches the driver.
          [ "$ENV_CONFLICT_MULTILINE" = "failure" ] || { echo "::error::multi-line extra-args lost its second line"; exit 1; }
          [ "$BAD_BOOL" = "failure" ] || { echo "::error::dry-run: True was not refused"; exit 1; }
          [ "$NO_PROJECT" = "failure" ] || { echo "::error::a directory without bynk.toml was not refused"; exit 1; }

      - name: Assert the dry runs left nothing behind
        shell: bash
        run: |
          set -euo pipefail
          if [ -e test/fixtures/pair/bynk.deploy.lock ]; then
            echo "::error::a dry run wrote bynk.deploy.lock"; exit 1
          fi
          git diff --exit-code -- test/fixtures

  fixtures:
    name: Fixtures pass bynkc check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: bynk-lang/setup-bynk@v1
        with:
          version: ${{ env.BYNK_VERSION }}
      - name: bynkc check
        shell: bash
        run: |
          set -euo pipefail
          for dir in test/fixtures/*/; do
            echo "::group::${dir}"
            (cd "$dir" && bynkc check --format short .)
            echo "::endgroup::"
          done
